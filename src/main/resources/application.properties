spring.config.import=optional:file:.env[.properties]
spring.application.name=dating-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dating}
spring.datasource.username=${DB_USERNAME:dating}
spring.datasource.password=${DB_PASSWORD:dating}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health

app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=30d
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173}

app.photos.dir=${PHOTO_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:${app.photos.dir}/
